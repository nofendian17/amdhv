name: Release

# Builds AMDHV.kext and the tools on a GitHub macOS runner, packages them with
# the sources, and attaches three archives to a GitHub Release. One is a zip
# named with "AMDHV" because OCAT only downloads assets whose name contains the
# kext name and then unzips them.
#
#   Trigger:  push a tag (v0.1.0, ...) or run it by hand from the Actions tab.
#   The v* tag is the release version; kext/Makefile stamps it into the built Info.plist.
#   Release notes: the install paragraph is static; the changelog below it is
#   built from the commit subjects since the previous v* tag, grouped by type.
#   Write commit subjects for the release, because they are user-visible.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release notes list the commits since the previous tag.
          fetch-depth: 0

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -qF "## [$V]" CHANGELOG.md || { echo "CHANGELOG.md has no [$V] section"; exit 1; }
          echo "Release version $V comes from tag $GITHUB_REF_NAME"

      - name: Build kext and tools
        run: make kext tools

      - name: Verify build outputs are x86_64
        run: |
          file build/AMDHV.kext/Contents/MacOS/AMDHV
          lipo -info build/amd-info build/hvf-smoke
          file build/AMDHV.kext/Contents/MacOS/AMDHV | grep -q x86_64

      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          STAGE="amdhv-${V}"
          mkdir -p "$STAGE"
          git archive HEAD | tar -x -C "$STAGE"
          mkdir -p "$STAGE/build"
          cp -R build/AMDHV.kext "$STAGE/build/"
          cp build/amd-info build/hvf-smoke "$STAGE/build/"
          tar -czf "amdhv-${V}-macos-x86_64.tar.gz" "$STAGE"
          git archive --format=tar.gz -o "amdhv-${V}-source.tar.gz" HEAD
          # OCAT matches asset names case-sensitively against "AMDHV" and runs
          # `unzip`, so ship a zip with AMDHV.kext at the archive root.
          (cd "$STAGE/build" && zip -qr "../../AMDHV-${V}-macos-x86_64.zip" AMDHV.kext)
          ls -la amdhv-${V}-*.tar.gz AMDHV-${V}-macos-x86_64.zip

      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="${TAG}"; fi

          {
            cat <<'EOF'
          Unsigned kext for OpenCore (Kernel -> Add). Install with scripts/install-to-efi.sh — needs the two boot-args amdhv_enable_svm=1 amdhv_hv=1. Binaries are x86_64; unit tests are meant to run on the target machine (make test).

          EOF
            if [ -n "$PREV" ]; then echo "## Changes since \`${PREV}\`"; else echo "## Changes"; fi
            echo

            git log --no-merges --pretty=format:'%s%x09%h' "$RANGE" | awk -F '\t' '
              function bucket(s) {
                if (s ~ /^feat(\([^)]*\))?:/)            return "Added";
                if (s ~ /^fix(\([^)]*\))?:/)             return "Fixed";
                if (s ~ /^(perf|refactor)(\([^)]*\))?:/) return "Changed";
                if (s ~ /^docs(\([^)]*\))?:/)            return "Documentation";
                if (s ~ /^(test|chore|build|ci)(\([^)]*\))?:/) return "Maintenance";
                return "Other";
              }
              {
                subject = $1;
                key = bucket(subject);
                sub(/^(feat|fix|perf|refactor|docs|test|chore|build|ci)(\([^)]*\))?: /, "", subject);
                items[key] = items[key] sprintf("- %s (`%s`)\n", subject, $2);
              }
              END {
                n = split("Added Fixed Changed Documentation Maintenance Other", order, " ");
                for (i = 1; i <= n; i++) {
                  if (order[i] in items) printf "### %s\n\n%s\n", order[i], items[order[i]];
                }
              }'

            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub release
        # A manual run from a branch only builds and packages; publishing needs a tag.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          gh release create "$TAG" \
            "amdhv-${V}-macos-x86_64.tar.gz" \
            "amdhv-${V}-source.tar.gz" \
            "AMDHV-${V}-macos-x86_64.zip" \
            --verify-tag \
            --title "AMDHV ${TAG}" \
            --notes-file release-notes.md
