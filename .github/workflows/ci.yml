name: CI

# Every push and pull request runs the host tests and builds the kext + tools,
# so a refactor cannot silently break either half of the project.

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Host unit tests
        run: make test

      - name: Build kext and tools
        run: make kext tools
